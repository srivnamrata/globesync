name: WebKit smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webkit-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright-webkit-smoke:
    name: Playwright WebKit smoke coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Install WebKit
        run: npx playwright install --with-deps webkit
      - name: Run WebKit smoke suite
        run: npm run test:e2e:smoke:webkit
      - name: Upload WebKit Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-webkit-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 14
