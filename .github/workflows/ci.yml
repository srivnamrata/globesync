name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run backend suite with coverage gate
        run: python -m pytest --cov=app --cov-branch --cov-fail-under=80 --cov-report=term-missing --cov-report=xml --cov-report=json
      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            backend/coverage.xml
            backend/coverage.json
          if-no-files-found: ignore
          retention-days: 14

  frontend-quality:
    name: Frontend tests, coverage, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run deterministic frontend coverage gate
        run: >-
          npm run test:coverage --
          --coverage.thresholds.statements=80
          --coverage.thresholds.branches=75
          --coverage.thresholds.functions=75
          --coverage.thresholds.lines=80
      - name: Build production frontend
        run: npm run build
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: ignore
          retention-days: 14

  playwright:
    name: Playwright Chromium critical paths
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run critical-path browser suite
        run: npm run test:e2e
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 14

  playwright-firefox-smoke:
    name: Playwright Firefox smoke coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Firefox
        run: npx playwright install --with-deps firefox
      - name: Run Firefox smoke suite
        run: npm run test:e2e:smoke:firefox
      - name: Upload Firefox Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-firefox-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 14

  migrations:
    name: PostgreSQL 15 migration gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: globesync_fresh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d globesync_fresh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install migration dependencies
        run: python -m pip install -r requirements.txt
      - name: Bootstrap fresh database and verify Alembic head
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/globesync_fresh
          SYNC_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/globesync_fresh
        run: |
          python scripts/bootstrap_fresh_database.py
          alembic upgrade head
          alembic current | tee fresh-migration.log
          grep -q "20260904_16 (head)" fresh-migration.log
      - name: Create preceding-revision database
        run: |
          python - <<'PY'
          import psycopg2
          connection = psycopg2.connect(
              host="localhost",
              port=5432,
              user="postgres",
              password="postgres",
              dbname="postgres",
          )
          connection.autocommit = True
          with connection.cursor() as cursor:
              cursor.execute("CREATE DATABASE globesync_upgrade")
          connection.close()
          PY
      - name: Upgrade immediately preceding revision to head
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/globesync_upgrade
          SYNC_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/globesync_upgrade
        run: |
          python scripts/bootstrap_fresh_database.py
          alembic downgrade 20260903_15
          alembic upgrade head
          alembic current | tee preceding-revision.log
          grep -q "20260904_16 (head)" preceding-revision.log
      - name: Upload migration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-logs
          path: |
            backend/fresh-migration.log
            backend/preceding-revision.log
          if-no-files-found: ignore
          retention-days: 14
