# Non-secret environment values for translation-api.
# Secret values are supplied with --set-secrets by deploy-cloudrun.ps1 / deploy-cloudrun.sh.
# Do NOT set GOOGLE_APPLICATION_CREDENTIALS — Cloud Run uses the service identity (ADC).
DEPLOYMENT_ENV: "production"
DEBUG: "false"
TRANSLATION_PROVIDER: "google"
GOOGLE_CLOUD_PROJECT: "project-794c406e-c0ab-4a50-8e9"
STORAGE_PROVIDER: "gcs"
GCS_BUCKET_NAME: "project-794c406e-c0ab-4a50-8e9-media-raw"
GCS_EXPORTS_BUCKET: "project-794c406e-c0ab-4a50-8e9-media-exports"
GCS_SIGNING_SERVICE_ACCOUNT: "globesync@project-794c406e-c0ab-4a50-8e9.iam.gserviceaccount.com"
DATABASE_POOL_SIZE: "5"
DATABASE_MAX_OVERFLOW: "0"
DATABASE_POOL_RECYCLE_SECONDS: "1800"
# Celery is intentionally unavailable in the initial two-service deployment.
ENABLE_BACKGROUND_PIPELINES: "false"
TRANSLATION_SYNC_FALLBACK: "true"
# Enable after the translation-jobs queue and OIDC invoker bindings exist.
CLOUD_TASKS_ENABLED: "false"
CLOUD_TASKS_LOCATION: "asia-south1"
CLOUD_TASKS_QUEUE: "translation-jobs"
CLOUD_TASKS_TARGET_URL: "https://placeholder.invalid"
CLOUD_TASKS_OIDC_SERVICE_ACCOUNT: "globesync@project-794c406e-c0ab-4a50-8e9.iam.gserviceaccount.com"
INTERNAL_TASKS_AUDIENCE: "https://placeholder.invalid"
ALLOWED_ORIGINS: '["http://localhost:3000"]'
